[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "content-marketing-ai"
version = "0.1.0"
description = "소상공인 카페의 Instagram 콘텐츠 제작·게시·분석"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146,<0.147", "uvicorn>=0.54,<0.55",
    "jinja2>=3.1.6,<4", "python-multipart>=0.0.32,<0.1",
    "httpx>=0.28.1,<0.29", "Pillow>=12,<14", "cryptography>=46,<51",
    "itsdangerous>=2.2,<3", "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["schema.sql", "templates/*.html", "static/*", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
